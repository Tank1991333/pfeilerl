<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pfeilerl</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16201C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pfeilerl">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8E2D4; --surface:#F6F2E9; --ink:#191C1A; --muted:#5D625D; --line:#CEC5B1;
  --red:#B8262C; --green:#17704A; --on-accent:#FFFFFF; --cur:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16201C; --surface:#202B26; --ink:#ECEBE3; --muted:#9BA39D; --line:#33403A;
    --red:#E0484E; --green:#3AAE72; --on-accent:#0E1411; --cur:#2A3832;
  }
}
:root[data-theme="dark"]{
  --bg:#16201C; --surface:#202B26; --ink:#ECEBE3; --muted:#9BA39D; --line:#33403A;
  --red:#E0484E; --green:#3AAE72; --on-accent:#0E1411; --cur:#2A3832;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.cond{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px}

/* Setup */
.top h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:64px;line-height:.9;margin:8px 0 4px;letter-spacing:-.01em}
.top p{margin:0 0 20px;color:var(--muted)}
section{margin:0 0 22px}
h2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:22px;margin:0 0 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-height:84px}
.mode .mname{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:24px;line-height:1}
.mode .mdesc{font-size:14px;color:var(--muted)}
.mode.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt{margin:0 0 12px}
.olabel{display:block;font-size:14px;color:var(--muted);margin:0 0 4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.players{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.players li{display:flex;gap:6px;align-items:center}
.players .num{width:22px;color:var(--muted);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:20px;text-align:center}
.players input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.icon{background:none;border:1px solid var(--line);border-radius:8px;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.icon:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:500}
.primary{background:var(--red);color:#fff;border:0;border-radius:10px;padding:14px 18px;font-weight:600}
.start{width:100%;font-size:18px;padding:16px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px 14px;margin:0 0 20px}
.resume span{font-size:15px}
.resume small{display:block;color:var(--muted)}

/* Statistik */
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tabs{margin:0 0 18px}
.muted{color:var(--muted)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px;margin:0}
table.rank{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
.rank th,.rank td{padding:8px;text-align:right;border-bottom:1px solid var(--line);font-size:15px;white-space:nowrap}
.rank thead th{font-size:13px;color:var(--muted);font-weight:500}
.rank th:first-child{text-align:left}
.rank tbody th button{background:none;border:0;padding:0;font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.rank tr.sel th button{color:var(--red);text-decoration-color:var(--red)}
.rank tbody tr:last-child th,.rank tbody tr:last-child td{border-bottom:0}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sv b{display:block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.sv span{font-size:13px;color:var(--muted)}
.trend{margin:8px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 6px}
.trend svg{width:100%;height:auto;display:block}
.trend figcaption{font-size:13px;color:var(--muted);margin-top:2px}
.games{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.games li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.games li div{display:flex;flex-direction:column;min-width:0;font-size:15px}
.gd{font-weight:600}.gs{font-size:13px;color:var(--muted)}
.icon.armed{width:auto;padding:0 10px;color:var(--red);border-color:var(--red)}

/* Game */
.game{padding-top:10px}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px}
.gmode{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:26px;line-height:1}
.gsub{font-size:14px;color:var(--muted)}
.ghost.warn{border-color:var(--red);color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 12px;position:relative;overflow:hidden}
.tile.cur{background:var(--cur);border-color:var(--ink)}
.tile.cur::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
.pname{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(40px,12vw,58px);line-height:.95;font-variant-numeric:tabular-nums}
.meta{display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.note{font-size:12px;color:var(--red);margin-top:2px}
.bar{height:5px;background:var(--line);border-radius:3px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.tw{overflow-x:auto}
table.cricket{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-variant-numeric:tabular-nums}
.cricket th,.cricket td{padding:3px 6px;text-align:center;border-bottom:1px solid var(--line)}
.cricket thead th{font-size:14px;font-weight:600;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cricket tbody th,.cricket tfoot th{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px;width:56px;text-align:left;padding-left:12px}
.cricket td{height:30px}
.cricket td svg{width:20px;height:20px;vertical-align:middle}
.cricket .cur{background:var(--cur);box-shadow:inset 0 3px 0 -1px transparent}
.cricket thead th.cur{color:var(--red)}
.cricket tr.done th,.cricket tr.done td{color:var(--muted);opacity:.5}
.cricket tfoot td{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:24px;border-bottom:0}
.cricket tfoot th{border-bottom:0}

.turn{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:12px 0 6px;min-height:58px}
.hint{display:flex;flex-direction:column;min-width:0}
.hint .who{font-weight:600}
.hint .co{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:20px;color:var(--green)}
.hint .warn{color:var(--red);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px}
.visit{display:flex;gap:4px;align-items:center;flex-shrink:0}
.slot{width:48px;height:40px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:20px;color:var(--muted)}
.slot.f{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--surface)}
.slot.t{color:var(--red)} .slot.d{color:var(--green)}
.vsum{min-width:40px;text-align:right;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:24px}

.boardwrap{display:flex;justify-content:center;margin:4px 0 10px}
#board{width:100%;max-width:440px;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:crosshair}
#board .sd{fill:#1F201D} #board .sl{fill:#EDE2C4} #board .mr{fill:#C4262C} #board .mg{fill:#1B7546}
#board path,#board circle.b{stroke:#A39C8A;stroke-width:.45}
#board .seg path,#board .seg circle{transition:opacity .2s}
#board .seg.dim path,#board .seg.dim circle{opacity:.22}
#board .num{fill:#EAE4D3;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:9px}
#board .num.dim{opacity:.35}
#board .hit{fill:#F4D23C;stroke:#1F201D;stroke-width:.8;animation:hit 1.1s ease-out forwards;pointer-events:none}
@keyframes hit{0%{r:5;opacity:1}100%{r:3;opacity:0}}
@media (prefers-reduced-motion: reduce){#board .hit{animation:none;opacity:0}#board .seg path{transition:none}}

.pad{margin:4px 0 10px}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.mod{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px;font-weight:600;font-size:17px}
#mD.on{background:var(--green);border-color:var(--green);color:#fff}
#mT.on{background:var(--red);border-color:var(--red);color:#fff}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;height:56px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;touch-action:manipulation}
.key:active{background:var(--ink);color:var(--bg)}
.key.dim{opacity:.3}
.key:disabled{opacity:.2;cursor:default}
.key.k25{grid-column:span 2}.key.kb{grid-column:span 3}
.controls{position:sticky;bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;padding:8px 0 4px;background:var(--bg)}
.controls button{padding:14px 8px;border-radius:10px;font-weight:600}
.controls .sec{background:var(--surface);border:1px solid var(--line)}
.controls .sec:disabled{opacity:.4;cursor:default}
.controls .primary.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.controls .primary.pulse{animation:pulse .5s ease-out}
@keyframes pulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){.controls .primary.pulse{animation:none}}

.ov{position:fixed;inset:0;background:rgba(10,14,12,.55);display:grid;place-items:center;padding:20px;z-index:10}
.ovcard{background:var(--surface);color:var(--ink);border-radius:14px;padding:22px 20px 18px;width:100%;max-width:400px}
.ovk{margin:0;color:var(--red);font-weight:600}
.ovcard h2{font-size:40px;line-height:1;margin:2px 0 14px}
.stats{list-style:none;padding:0;margin:0 0 18px}
.stats li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.stats li span:last-child{color:var(--muted)}
.ovbtns{display:grid;gap:8px}
.ovbtns button{padding:13px}
/* Erweiterungen */
.gtools{display:flex;gap:6px}
.ls{display:flex;gap:8px;font-size:13px;font-weight:600;margin-top:2px}
.ls span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:0 6px;margin-top:3px;background:var(--red);color:#fff}
.badge.ok{background:var(--green)}
.badge.out{background:var(--muted)}
.lives{color:var(--red);letter-spacing:2px;font-size:15px}
.tile.out{opacity:.5}
.pad.busy{opacity:.45;pointer-events:none}
.botrow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.botrow .botname{font-weight:600}
.botrow .seg button{padding:5px 10px;font-size:14px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--red);font-weight:600;margin:0 0 10px}
.heat{margin:8px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.heat svg{width:100%;max-width:300px;display:block;margin:0 auto}
.heat figcaption{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
.tops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
.tops span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.tops b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:17px;margin-right:4px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:50px;height:50px;flex-shrink:0}
.tbtns{display:flex;gap:6px;margin:0 0 20px}
.top p{margin:0 0 12px}
.ovach{background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 14px;display:flex;flex-direction:column;gap:2px}
.ovach b{color:var(--green)}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:10px 12px}
.tip b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:21px;font-weight:700}
.tip p{margin:2px 0 8px;font-size:15px;color:var(--muted)}
.tip .ghost{padding:7px 12px}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.a{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.a b{font-weight:600}
.a span{font-size:13px;color:var(--muted)}
.a em{font-style:normal;font-weight:600;color:var(--ink)}
.a.lock{opacity:.5}
.a:not(.lock){border-color:var(--green)}
h2 .muted{font-family:'Barlow',system-ui,sans-serif;font-size:15px;font-weight:500}
.matches{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.match{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.match>div{display:flex;flex-direction:column;min-width:0}
.match .vs{font-size:12px;color:var(--muted)}
.match .win{font-weight:700;color:var(--green)}
.warnt{color:var(--red)}
.primary.sm{padding:9px 14px}
.champ{background:var(--red);color:#fff;border-radius:12px;padding:14px 16px;margin:0 0 18px;display:flex;flex-direction:column}
.champ span{font-size:14px;opacity:.9}
.champ b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:36px;line-height:1}
.tbtns{flex-wrap:wrap}
.code{display:inline-block;margin-left:4px;color:var(--green);letter-spacing:.05em}
.camline{margin:0 0 8px;padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;font:inherit;font-size:20px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.camslot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px;display:flex;flex-direction:column;gap:8px}
.camhead{display:flex;justify-content:space-between;align-items:center}
.okc{color:var(--green);font-weight:600}
.camprev{width:100%;height:auto;background:#000;border-radius:6px;display:block}
.calcv{width:100%;height:auto;background:#000;border-radius:8px;display:block;margin:0 0 10px;cursor:crosshair;touch-action:manipulation}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
'use strict';
const SEGS=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*10)/10).toFixed(1).replace('.',',');
const val=d=>d.seg*d.mult;
const label=d=>{
  if(!d.mult) return '–';
  if(d.seg===25) return d.mult===2?'Bull':'25';
  return (d.mult===3?'T':d.mult===2?'D':'')+d.seg;
};
const hitKey=d=>!d.mult?'0':d.seg===25?(d.mult===2?'50':'25'):(d.mult===3?'T':d.mult===2?'D':'S')+d.seg;
const keyLabel=k=>k==='0'?'Daneben':k==='50'?'Bull':k==='25'?'25':k[0]==='S'?k.slice(1):k;
function newId(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- Checkout ---------- */
const DARTS=(()=>{
  const setup=[],dbl=[],trp=[];
  for(let s=20;s>=1;s--) setup.push({l:'T'+s,v:s*3,m:3});
  setup.push({l:'Bull',v:50,m:2},{l:'25',v:25,m:1});
  for(let s=20;s>=1;s--) setup.push({l:String(s),v:s,m:1});
  for(let s=20;s>=1;s--) setup.push({l:'D'+s,v:s*2,m:2});
  [20,16,18,12,10,8,14,6,4,2,19,17,15,13,11,9,7,5,3,1].forEach(s=>dbl.push({l:'D'+s,v:s*2,m:2}));
  dbl.push({l:'Bull',v:50,m:2});
  for(let s=20;s>=1;s--) trp.push({l:'T'+s,v:s*3,m:3});
  return {setup,dbl,trp};
})();
function checkout(score,darts,out){
  if(score<=0||darts<1) return null;
  const fin=out==='double'?DARTS.dbl:out==='master'?DARTS.dbl.concat(DARTS.trp):DARTS.setup;
  const S=DARTS.setup;
  for(const f of fin) if(f.v===score) return [f.l];
  if(darts>=2) for(const f of fin){const r=score-f.v;if(r<=0)continue;for(const a of S) if(a.v===r) return [a.l,f.l];}
  if(darts>=3) for(const f of fin){const r=score-f.v;if(r<=1)continue;for(const a of S){const r2=r-a.v;if(r2<=0)continue;for(const b of S) if(b.v===r2) return [a.l,b.l,f.l];}}
  return null;
}
function parseT(l){
  if(l==='Bull') return {seg:25,mult:2};
  if(l==='25') return {seg:25,mult:1};
  if(l[0]==='T') return {seg:+l.slice(1),mult:3};
  if(l[0]==='D') return {seg:+l.slice(1),mult:2};
  return {seg:+l,mult:1};
}
function finishAim(score,left,out){
  const c=checkout(score,left,out);
  if(c) return parseT(c[0]);
  if(score>60) return {seg:20,mult:3};
  for(const lv of [40,32,24,16,36,20,8,4,2]){const s=score-lv;if(s>=1&&s<=20) return {seg:s,mult:1};}
  return {seg:1,mult:1};
}

/* ---------- Computer-Gegner ---------- */
const BOTS={1:{n:'Anfänger',s:45},2:{n:'Hobby',s:20},3:{n:'Liga',s:14},4:{n:'Profi',s:9}};
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function aimPoint(t){
  if(t.seg===25) return [0,0];
  const a=(SEGS.indexOf(t.seg)*18-90)*Math.PI/180,r=t.mult===3?103:t.mult===2?166:134;
  return [r*Math.cos(a),r*Math.sin(a)];
}
function classify(x,y){
  const r=Math.hypot(x,y);
  if(r>170) return {seg:0,mult:0};
  if(r<=6.35) return {seg:25,mult:2};
  if(r<=15.9) return {seg:25,mult:1};
  let a=Math.atan2(x,-y)*180/Math.PI;if(a<0)a+=360;
  const seg=SEGS[Math.floor(((a+9)%360)/18)];
  if(r>=99&&r<=107) return {seg,mult:3};
  if(r>=162) return {seg,mult:2};
  return {seg,mult:1};
}
function botThrow(g,p){
  const b=BOTS[p.bot]||BOTS[2];
  const t=MODES[g.mode].aim(g,p,b);
  const [x,y]=aimPoint(t);
  return classify(x+gauss()*b.s,y+gauss()*b.s);
}

function countVisit(p,s){
  if(p.visits<3) p.f9+=s;
  p.visits++;
  p.best=Math.max(p.best,s);
  if(s>=180) p.v180++; else if(s>=140) p.v140++; else if(s>=100) p.v100++;
}

/* ---------- Zustand ---------- */

/* ---------- Sprachausgabe ---------- */
function say(t){
  if(!t||!setup.voice||!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function visitCall(g,p){
  if(g.legDone) return `Game shot und ${g.setWon?'der Satz':'das Leg'}, ${p.name}`;
  if(!MODES[g.mode].scoreCall) return '';
  if(g.bust) return 'Überworfen';
  if(g.mode==='ct'&&p.done) return 'Check';
  const s=g.visit.reduce((a,d)=>a+val(d),0);
  return s===180?'Einhundertachtzig! Leiwand!':s===0?'Keine Punkte':String(s);
}
function winCall(g){
  const n=g.winner.map(i=>g.players[i].name);
  if(n.length>1) return 'Unentschieden';
  if(g.mode==='x01') return 'Game shot und das Match, '+n[0];
  return (g.msg==='Shanghai!'?'Shanghai! ':'')+n[0]+' gewinnt';
}
function promptCall(g){const m=MODES[g.mode],p=g.players[g.cur];return m.prompt?m.prompt(g,p):nameOnly(g,p);}

/* ---------- Spiel ---------- */
function startGame(fromSaved,cfg){
  if(fromSaved){
    game=saved.g;history=saved.h||[];if(!game.gid) game.gid=newId();
    if(game.online&&!onl){const o=store.get('dart.online');if(o&&o.code===game.online){onl=o;onlRev=0;onlSubscribe();}}
    if(game.mode==='x01'){game.leg=game.leg||1;game.legStarter=game.legStarter||0;game.players.forEach(p=>{for(const k of ['v100','v140','v180','f9','f9d','coAtt','coHit','finish','visits','legs','sets','legsWon','scoredPrev','legDarts0','bestLeg']) if(typeof p[k]!=='number') p[k]=0;});}

    game={gid:newId(),tour:cfg?cfg.tour:null,mode,opts:clone(cfg?cfg.opts:setup.opts[mode]),players:cfg?clone(cfg.players):setup.players.map((pl,i)=>({name:(pl.name||'').trim()||'Spieler '+(i+1),bot:pl.bot||0})),cur:0,round:1,visit:[],locked:false,bust:false,winner:null,msg:''};

  app.innerHTML=`<div class="wrap game">
  <header class="gbar"><div><div class="gmode">${m.name}</div><div class="gsub">${esc(m.sub(game.opts))}${game.online?` <b class="code">Online ${esc(game.online)}</b>`:''}</div></div><div class="gtools"><button class="ghost" id="voice"></button><button class="ghost" id="quit">Beenden</button></div></header>
  <div id="score"></div>
  <div class="turn"><div class="hint" id="hint" aria-live="polite"></div><div class="visit" id="visit"></div></div>

  <nav class="controls"><button class="sec" id="undo">Rückgängig</button><button class="sec" id="miss">Daneben</button><button class="primary" id="next">Weiter</button></nav>

  document.getElementById('pad').addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t||t.disabled) return;
    if(t.id==='mD'||t.id==='mT'){const v=t.id==='mD'?2:3;setMod(mod===v?1:v);return;}
    const n=+t.dataset.n;if(!n) return;
    const d=n===50?{seg:25,mult:2}:n===25?{seg:25,mult:mod===2?2:1}:{seg:n,mult:mod};
    setMod(1);throwDart(d);
  });
  setMod(1);

  document.getElementById('next').onclick=()=>nextVisit(false);

  document.getElementById('voice').onclick=()=>{setup.voice=!setup.voice;saveSetup();voiceBtn();if(setup.voice) say(promptCall(game)||'Ansage an');else if(window.speechSynthesis) speechSynthesis.cancel();};

function voiceBtn(){const b=document.getElementById('voice');if(!b) return;b.textContent=setup.voice?'🔊':'🔇';b.setAttribute('aria-label',setup.voice?'Ansage ausschalten':'Ansage einschalten');}
function setMod(m){
  mod=m;

function throwDart(d,fromBot){
  if(!game||game.winner) return;
  if(isBotTurn()&&!fromBot) return;
  if(!fromBot&&!canAct()) return;
  if(game.locked||game.legDone){pulseNext();return;}
  history.push(clone(game));
  const p=game.players[game.cur];
  game.visit.push(d);
  p.hm=p.hm||{};const k=hitKey(d);p.hm[k]=(p.hm[k]||0)+1;
  MODES[game.mode].dart(game,p,d);
  if(game.visit.length>=3&&!game.winner) game.locked=true;
  if(game.winner) onFinish();
  if(game.winner||game.locked){game.called=true;say(game.winner?[MODES[game.mode].scoreCall&&!game.legDone?visitCall(game,p):'',winCall(game)].filter(Boolean).join('. '):visitCall(game,p));}
  if(!fromBot&&navigator.vibrate) try{navigator.vibrate(12)}catch(e){}
  saveGame();update();
}

function advance(g){
  const n=g.players.length;let c=g.cur;
  for(let k=1;k<=n;k++){const x=(g.cur+k)%n;if(!g.players[x].out){c=x;break;}}
  const wrapped=c<=g.cur;g.cur=c;if(wrapped) g.round++;
  return wrapped;
}

function nextVisit(fromBot){
  if(!game||game.winner) return;
  if(isBotTurn()&&!fromBot) return;
  if(!fromBot&&!canAct()) return;
  history.push(clone(game));
  const m=MODES[game.mode];
  if(m.beforeNext&&m.beforeNext(game)){
    game.visit=[];game.locked=false;game.bust=false;game.called=false;
    saveGame();update();say(promptCall(game));return;
  }
  const p=game.players[game.cur];
  while(game.visit.length<3&&!game.locked&&!game.winner){const d={seg:0,mult:0};game.visit.push(d);m.dart(game,p,d);}
  const pre=game.called?'':visitCall(game,p);
  if(m.endVisit) m.endVisit(game,p);
  game.visit=[];game.locked=false;game.bust=false;game.called=false;game.msg='';
  if(m.afterVisit) m.afterVisit(game);
  if(!game.winner){
    if(m.keepTurn&&m.keepTurn(game,p)){if(m.startVisit) m.startVisit(game,p);}
    else{
      const w=advance(game);
      if(w&&m.onRound) m.onRound(game);
      if(!game.winner&&m.startVisit) m.startVisit(game,game.players[game.cur]);
    }
  }
  if(game.winner) onFinish();
  saveGame();update();
  say([pre,game.winner?winCall(game):promptCall(game)].filter(Boolean).join('. '));
}

function undo(){
  if(!history.length) return;
  clearTimeout(botTimer);botTimer=null;
  const was=!!game.winner,gid=game.gid;
  game=history.pop();
  while(history.length&&game.players[game.cur].bot&&!game.winner&&game.players.some(p=>!p.bot)) game=history.pop();
  if(was&&!game.winner){deleteRecord(gid);revertTour(game);}
  if(window.speechSynthesis) try{speechSynthesis.cancel()}catch(e){}
  saveGame();update();
}

function scheduleBot(){
  clearTimeout(botTimer);botTimer=null;
  if(!isBotTurn()||(onl&&!onl.host)) return;
  const fin=game.locked||game.legDone;
  botTimer=setTimeout(()=>{
    botTimer=null;
    if(!isBotTurn()) return;
    if(game.locked||game.legDone) nextVisit(true);
    else throwDart(botThrow(game,game.players[game.cur]),true);
  },fin?1500:750);
}

function pulseNext(){const n=document.getElementById('next');if(!n) return;n.classList.remove('pulse');void n.offsetWidth;n.classList.add('pulse');}

function quit(){
  const q=document.getElementById('quit');
  if(!quitArmed&&!game.winner){quitArmed=true;q.textContent='Wirklich?';q.classList.add('warn');
    setTimeout(()=>{if(quitArmed&&q.isConnected){quitArmed=false;q.textContent='Beenden';q.classList.remove('warn');}},3000);return;}
  endGame();
}
function endGame(toT){
  onlLeave();
  clearTimeout(botTimer);botTimer=null;
  if(window.speechSynthesis) try{speechSynthesis.cancel()}catch(e){}
  store.del('dart.game');game=null;history=[];
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}
  if(toT===true) renderTour(); else renderSetup();
  window.scrollTo(0,0);
}

function update(){
  const m=MODES[game.mode],p=game.players[game.cur],bot=isBotTurn(),wait=!bot&&!canAct();
  document.getElementById('score').innerHTML=m.board(game);
  let h='';
  if(game.winner) h='<span class="who">Spiel vorbei</span>';

  else if(game.bust) h=`<span class="who">${esc(p.name)}</span><span class="warn">Überworfen, zurück auf ${game.mode==='ct'?p.rem:p.score}</span>`;

  else if(wait) h=`<span class="who">${esc(p.name)} ist dran</span><span class="co">Online, warte auf den Wurf</span>`;
  else if(game.locked) h=`<span class="who">${game.mode==='ct'&&p.done?'Geschafft! ':''}Darts ziehen, dann Weiter</span>`;
  else{const t=m.hint(game,p);h=`<span class="who">${esc(p.name)} wirft</span>${t?`<span class="co">${esc(t)}</span>`:''}${game.msg?`<span class="co">${esc(game.msg)}</span>`:''}`;}
  document.getElementById('hint').innerHTML=h;
  let v='';
  for(let i=0;i<3;i++){const d=game.visit[i];v+=d?`<div class="slot f ${d.mult===3?'t':d.mult===2?'d':''}">${label(d)}</div>`:'<div class="slot"></div>';}
  v+=`<div class="vsum">${game.visit.length?game.visit.reduce((a,d)=>a+val(d),0):''}</div>`;
  document.getElementById('visit').innerHTML=v;
  const tg=m.targets?m.targets(game):null;

  const n=document.getElementById('next');

  n.textContent=game.legDone?'Nächstes Leg':game.locked&&game.players.length>1&&!(m.keepTurn&&m.keepTurn(game,p)&&!(p.done||p.used>=game.opts.darts))?'Weiter zu '+nxt:'Weiter';
  n.classList.toggle('idle',!(game.locked||game.legDone));
  n.disabled=bot||wait;
  document.getElementById('undo').disabled=!history.length;
  document.getElementById('miss').disabled=!!(game.locked||game.winner||game.legDone||bot||wait);
  const ov=document.getElementById('ov');
  if(game.winner){
    const names=game.winner.map(i=>esc(game.players[i].name));

    const achHTML=na.length?`<div class="ovach"><b>Neu freigeschaltet</b>${na.map(x=>`<span>★ ${esc(x[1])}${multi?' ('+esc(x[0])+')':''}</span>`).join('')}</div>`:'';
    ov.innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-labelledby="ovh"><div class="ovcard">
      <p class="ovk">${esc(game.msg||'Spiel vorbei')}</p>
      <h2 id="ovh" class="cond">${names.length>1?'Unentschieden: '+names.join(' und '):names[0]+' gewinnt'}</h2>
      <ul class="stats">${m.stats(game).map(s=>`<li><span>${esc(s[0])}</span><span>${esc(s[1])}</span></li>`).join('')}</ul>
      ${achHTML}<div class="ovbtns">${game.tour?'<button class="primary" id="again">Zum Turnier</button>':'<button class="primary" id="again">Revanche</button><button class="ghost" id="newg">Neues Spiel</button>'}<button class="ghost" id="undo2">Letzten Wurf zurücknehmen</button></div></div></div>`;
    document.getElementById('again').onclick=game.tour?toTour:rematch;
    if(!game.tour) document.getElementById('newg').onclick=endGame;
    document.getElementById('undo2').onclick=undo;
    document.getElementById('again').focus();
  } else ov.innerHTML='';
  scheduleBot();
}

function rematch(){
  const pl=game.players.map(p=>({name:p.name,bot:p.bot||0}));

/* ---------- Statistik ---------- */
let dbCol=null,dbNs=null;
function getDbNs(){
  if(!dbNs) dbNs=(async()=>{try{
    if(!window.claude||typeof window.claude.use!=='function') return null;
    return await window.claude.use('db');
  }catch(e){return null;}})();
  return dbNs;
}
function getCol(){
  if(!dbCol) dbCol=(async()=>{try{
    const db=await getDbNs();if(!db) return null;
    const u=await window.claude.use('user');const uid=u?await u.id():null;if(!uid) return null;
    return db.collection('data/users/'+uid+'/games');
  }catch(e){return null;}})();
  return dbCol;
}
const localRecs=()=>store.get('dart.records')||[];
function putLocal(rec){const a=localRecs().filter(r=>r.id!==rec.id);a.push(rec);a.sort((x,y)=>x.ts-y.ts);store.set('dart.records',a.slice(-1000));}
async function saveRecord(rec){
  rec.pending=true;putLocal(rec);
  const col=await getCol();if(!col) return;
  try{const r=clone(rec);delete r.pending;await col.doc(rec.id).set(r);rec.pending=false;putLocal(rec);}catch(e){}
}
async function deleteRecord(id){
  store.set('dart.records',localRecs().filter(r=>r.id!==id));
  const col=await getCol();if(!col) return;
  try{await col.doc(id).delete();}catch(e){}
}
async function loadRecords(){
  const local=localRecs();
  const col=await getCol();
  if(!col) return local;
  try{
    const snap=await col.orderBy('ts','desc').limit(1000).get();
    const map=new Map();
    snap.docs.forEach(d=>{if(d.exists) map.set(d.id,Object.assign({},d.data(),{id:d.id}));});
    for(const r of local){
      if(r.pending&&!map.has(r.id)){
        const c=clone(r);delete c.pending;
        try{await col.doc(r.id).set(c);map.set(r.id,c);}catch(e){map.set(r.id,r);}
      }
    }
    const all=[...map.values()].sort((a,b)=>a.ts-b.ts);
    store.set('dart.records',all.slice(-1000));
    return all;
  }catch(e){return local;}
}
function buildRecord(g){
  const m=MODES[g.mode];
  return {id:g.gid,ts:Date.now(),mode:g.mode,opts:clone(g.opts),
    players:g.players.map((p,i)=>Object.assign({name:p.name,bot:p.bot||0,won:g.winner.includes(i),darts:p.darts||0,hm:p.hm||{}},m.record(g,p)))};
}

  window.scrollTo(0,0);
  const recs=await loadRecords();

}
function agg(es,mode){
  const n=es.length,sum=k=>es.reduce((a,e)=>a+(e[k]||0),0),max=k=>es.reduce((a,e)=>Math.max(a,e[k]||0),0);
  const r={n,w:es.filter(e=>e.won).length};r.pct=n?r.w/n*100:0;
  if(mode==='x01'){
    const d=sum('darts'),f=sum('f9d'),ca=sum('coAtt'),ga=e=>e.darts?e.scored/e.darts*3:0;
    Object.assign(r,{avg:d?sum('scored')/d*3:0,bestAvg:es.reduce((a,e)=>Math.max(a,ga(e)),0),f9:f?sum('f9')/f*3:0,best:max('best'),co:max('checkout'),coq:ca?sum('coHit')/ca*100:null,v100:sum('v100'),v140:sum('v140'),v180:sum('v180'),trend:es.map(ga)});
    r.main=r.avg;

    r.main=r.mpr;

    r.main=r.bestD;
  }else if(mode==='killer'){
    Object.assign(r,{kills:sum('kills'),avgK:n?sum('kills')/n:0,trend:es.map(e=>e.kills||0)});
    r.main=r.pct;
  }else if(mode==='bobs'){
    const d=sum('darts');
    Object.assign(r,{bestS:es.reduce((a,e)=>Math.max(a,e.score??-Infinity),-Infinity),avgS:n?sum('score')/n:0,dq:d?sum('hits')/d*100:0,trend:es.map(e=>e.score||0)});
    r.main=r.bestS;

    r.main=r.q;

    Object.assign(r,{bestS:max('score'),avgS:n?sum('score')/n:0,trend:es.map(e=>e.score||0)});
    r.main=r.bestS;
  }
  return r;
}
function detail(a){

const TCAP={x01:'3-Dart-Average',cricket:'Marks pro Runde',atc:'Trefferquote',shanghai:'Punkte',killer:'Abschüsse',bobs:'Punkte',ct:'Erfolgsquote'};
function trendSVG(t){
  t=t.slice(-20);if(t.length<2) return '';
  const W=320,H=100,P=8,mn=Math.min(0,...t),mx=Math.max(...t)*1.15||1,rg=(mx-mn)||1;
  const pts=t.map((v,i)=>[P+i*(W-2*P)/(t.length-1),H-P-(v-mn)/rg*(H-2*P)]);
  const cap=TCAP[sv.mode];
  return `<figure class="trend"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cap} der letzten ${t.length} Spiele"><polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--green)"/>`).join('')}</svg><figcaption>${cap} der letzten ${t.length} Spiele</figcaption></figure>`;
}
function heatSVG(es){
  const hm={};es.forEach(e=>{for(const k in (e.hm||{})) hm[k]=(hm[k]||0)+e.hm[k];});
  const total=Object.values(hm).reduce((a,b)=>a+b,0);
  if(!total) return '';
  const max=Math.max(...Object.entries(hm).filter(([k])=>k!=='0').map(([,v])=>v),1);
  const pol=(r,a)=>{const t=(a-90)*Math.PI/180;return (r*Math.cos(t)).toFixed(2)+' '+(r*Math.sin(t)).toFixed(2);};
  const sec=(r1,r2,a0,a1)=>`M${pol(r2,a0)}A${r2} ${r2} 0 0 1 ${pol(r2,a1)}L${pol(r1,a1)}A${r1} ${r1} 0 0 0 ${pol(r1,a0)}Z`;
  const op=k=>hm[k]?(0.12+0.88*hm[k]/max).toFixed(2):0;
  const bed=(d,k)=>`<path d="${d}" fill="var(--surface)" stroke="var(--line)" stroke-width=".6"/>${hm[k]?`<path d="${d}" fill="var(--red)" fill-opacity="${op(k)}"/>`:''}`;
  let s='<svg viewBox="-104 -104 208 208" role="img" aria-label="Trefferbild">';
  SEGS.forEach((seg,i)=>{
    const a0=i*18-9,a1=i*18+9;
    s+=bed(sec(13,47,a0,a1),'S'+seg)+bed(sec(47,58,a0,a1),'T'+seg)+bed(sec(58,78,a0,a1),'S'+seg)+bed(sec(78,88,a0,a1),'D'+seg);
    const p=pol(96,i*18).split(' ');
    s+=`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="central" font-size="9" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="600" fill="var(--muted)">${seg}</text>`;
  });
  s+=`<circle r="13" fill="var(--surface)" stroke="var(--line)" stroke-width=".6"/>${hm['25']?`<circle r="13" fill="var(--red)" fill-opacity="${op('25')}"/>`:''}<circle r="6" fill="var(--surface)" stroke="var(--line)" stroke-width=".6"/>${hm['50']?`<circle r="6" fill="var(--red)" fill-opacity="${op('50')}"/>`:''}</svg>`;
  const tops=Object.entries(hm).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>`<span><b>${keyLabel(k)}</b>${Math.round(v/total*100)} %</span>`).join('');
  return `<figure class="heat">${s}<div class="tops">${tops}</div><figcaption>Trefferbild aus ${total} Darts, je dunkler, desto öfter getroffen</figcaption></figure>`;
}
function gameRow(r){

const achDone=(a,es)=>a.t?a.t(es):a.c(es)>=a.goal;
function entriesFor(recs,name){

    Object.assign({mode:r.mode,start:r.opts?r.opts.start:0,beatPro:!!p.won&&r.players.some(q=>q!==p&&q.bot===4)},p)));
}
function newAchievements(g){
  const recs=localRecs(),cur=recs.find(r=>r.id===g.gid);
  if(!cur) return [];
  const before=recs.filter(r=>r.id!==cur.id),out=[];
  cur.players.filter(p=>!p.bot).forEach(p=>{
    const all=entriesFor(recs,p.name),old=entriesFor(before,p.name);

    if(a.avg<45) T.push({t:'Shanghai über 20 Runden',why:`Bei einem Average von ${fmt(a.avg)} bringt Treffsicherheit auf einzelne Zahlen am meisten.`,mode:'shanghai',opts:{rounds:20}});

/* ---------- Turnier ---------- */
let tour=store.get('dart.tour'),tourFmt='ko',tourArmed=false,tourErr='';
const saveTour=()=>{if(tour) store.set('dart.tour',tour);else store.del('dart.tour');};
function createTour(){
  const ps=setup.players.map((pl,i)=>({name:(pl.name||'').trim()||'Spieler '+(i+1),bot:pl.bot||0}));
  tour={id:newId(),mode:setup.mode,opts:clone(setup.opts[setup.mode]),fmt:tourFmt,players:ps};
  if(tourFmt==='ko'){
    const order=shuffle(ps.map((_,i)=>i));
    let size=1;while(size<order.length) size*=2;
    const byes=size-order.length,r0=[];let k=0;
    for(let m=0;m<size/2;m++){
      if(m<byes){const a=order[k++];r0.push({a,b:null,w:a,bye:true});}
      else r0.push({a:order[k++],b:order[k++],w:null});
    }
    tour.rounds=[r0];
    for(let cnt=size/4;cnt>=1;cnt/=2) tour.rounds.push(Array.from({length:cnt},()=>({a:null,b:null,w:null})));
    resolveKO();
  }else{
    const gs=[];for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++) gs.push({a:i,b:j,w:null});
    tour.games=shuffle(gs);
  }
  saveTour();
}
function resolveKO(){
  for(let r=1;r<tour.rounds.length;r++) tour.rounds[r].forEach((m,i)=>{
    const fa=tour.rounds[r-1][2*i],fb=tour.rounds[r-1][2*i+1];
    m.a=fa.w!=null?fa.w:null;m.b=fb.w!=null?fb.w:null;
    if(m.w!=null&&m.w!==m.a&&m.w!==m.b) m.w=null;
  });
}
function roundName(r){const k=tour.rounds.length-1-r;return k===0?'Finale':k===1?'Halbfinale':k===2?'Viertelfinale':'Runde '+(r+1);}
function tourMatch(ref){const p=ref.split(':');return p[0]==='k'?(tour.rounds[+p[1]]||[])[+p[2]]:tour.games[+p[1]];}
function standings(){
  const st=tour.players.map((_,i)=>({i,sp:0,s:0,u:0,n:0,pts:0}));
  tour.games.forEach(g=>{
    if(g.w==null) return;
    st[g.a].sp++;st[g.b].sp++;

const CAL_PTS=[['die Mitte des Bulls',0,0],['den äußeren Draht der Double 20 (oben)',0,170],['den äußeren Draht der Double 6 (rechts)',170,0],['den äußeren Draht der Double 3 (unten)',0,-170],['den äußeren Draht der Double 11 (links)',-170,0]];

async function camStart(){

const calOf=i=>{const id=cam.slots[i];const c=id&&cam.cal[id];return c&&c.p?c:null;};
function gray(i){
  const v=cam.videos[i];if(!v||v.readyState<2) return null;
  wctx.drawImage(v,0,0,CW,CH);
  const d=wctx.getImageData(0,0,CW,CH).data,g=new Uint8Array(CW*CH);
  for(let k=0,j=0;k<g.length;k++,j+=4) g[k]=(d[j]*77+d[j+1]*151+d[j+2]*28)>>8;
  return g;
}
function bandRows(c){return [Math.max(0,Math.floor(c.band[0]*CH)),Math.min(CH-1,Math.ceil(c.band[1]*CH))];}
function diffFrac(f,r,c){
  const [y0,y1]=bandRows(c);let n=0;
  for(let y=y0;y<=y1;y++){const o=y*CW;for(let x=0;x<CW;x++) if(Math.abs(f[o+x]-r[o+x])>28) n++;}
  return n/((y1-y0+1)*CW);
}
function findTip(f,r,c){
  const [y0,y1]=bandRows(c),px=[];
  for(let y=y0;y<=y1;y++){const o=y*CW;for(let x=0;x<CW;x++) if(Math.abs(f[o+x]-r[o+x])>28){const nx=x/CW,ny=y/CH;px.push([nx,Math.abs(ny-(c.line[0]*nx+c.line[1]))]);}}

function solve(A,b){
  const n=b.length,M=A.map((r,i)=>r.concat([b[i]]));
  for(let i=0;i<n;i++){
    let p=i;for(let k=i+1;k<n;k++) if(Math.abs(M[k][i])>Math.abs(M[p][i])) p=k;
    [M[i],M[p]]=[M[p],M[i]];
    if(Math.abs(M[i][i])<1e-12) return null;
    for(let k=0;k<n;k++){if(k===i) continue;const f=M[k][i]/M[i][i];for(let j=i;j<=n;j++) M[k][j]-=f*M[i][j];}

function lsq(rows,rhs){

const camAllowed=()=>!!game&&!game.winner&&!isBotTurn()&&canAct();
function camTick(){
  const frames=[0,1,2].map(i=>calOf(i)?gray(i):null);
  if(frames.filter(Boolean).length<2) return;
  const TH=[0.006,0.0035,0.002][cam.sens],HAND=0.12;
  let mxR=0,mxM=0;
  frames.forEach((f,i)=>{
    if(!f) return;const c=calOf(i);
    if(!cam.ref[i]) cam.ref[i]=f;
    mxR=Math.max(mxR,diffFrac(f,cam.ref[i],c));
    if(cam.prev[i]) mxM=Math.max(mxM,diffFrac(f,cam.prev[i],c));
    cam.prev[i]=f;
  });
  if(cam.state==='idle'){
    if(mxR>TH){cam.state='moving';cam.still=0;}
    else if(++cam.idle>40){cam.idle=0;frames.forEach((f,i)=>{if(f) cam.ref[i]=f;});}
    return;
  }
  cam.still=mxM<TH*0.5?cam.still+1:0;
  if(cam.still<4) return;
  const resetRef=()=>frames.forEach((f,i)=>{if(f) cam.ref[i]=f;});
  if(mxR>HAND){
    cam.last='Darts gezogen';resetRef();
    if(game&&game.locked&&camAllowed()) nextVisit(false);
  }else if(mxR>TH){
    const lines=[];
    frames.forEach((f,i)=>{
      if(!f) return;const c=calOf(i),x=findTip(f,cam.ref[i],c);
      if(x==null) return;
      const [a1,a2,a3,c1,c2]=c.p;lines.push([a1-x*c1,a2-x*c2,x-a3]);
    });
    const P=triangulate(lines);
    if(P){
      const d=classify(P[0],-P[1]);
      cam.last='Erkannt: '+(d.mult?label(d):'daneben');
      if(camAllowed()) throwDart(d);
    }else cam.last='Dart nicht eindeutig erkannt, bitte per Taste eingeben';
    resetRef();

}
function camToggle(){

function camPreview(){

  cam.pv=setInterval(()=>{
    let any=false;

      if(v&&v.readyState>=2){const x=cv.getContext('2d');x.drawImage(v,0,0,cv.width,cv.height);const c=calOf(i);
        if(c){x.strokeStyle='rgba(244,210,60,.9)';x.lineWidth=1;const [y0,y1]=c.band;x.strokeRect(0,y0*cv.height,cv.width,(y1-y0)*cv.height);}}
    }
    if(!any){clearInterval(cam.pv);cam.pv=null;}
  },200);
}
function drawCal(){
  const cv=document.getElementById('calcv');if(!cv||!cam.calImg) return;
  const x=cv.getContext('2d');x.drawImage(cam.calImg,0,0,cv.width,cv.height);
  cam.calPts.forEach((p,k)=>{x.fillStyle='#F4D23C';x.strokeStyle='#1F201D';x.lineWidth=2;x.beginPath();x.arc(p.ix*cv.width,p.iy*cv.height,7,0,7);x.fill();x.stroke();x.fillStyle='#1F201D';x.font='bold 10px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(String(k+1),p.ix*cv.width,p.iy*cv.height);});
}
function calSnap(){
  const v=cam.videos[cam.calSlot];if(!v||v.readyState<2) return;
  const c=document.createElement('canvas');c.width=640;c.height=480;c.getContext('2d').drawImage(v,0,0,640,480);cam.calImg=c;
}
function calClick(e){
  const cv=e.target,r=cv.getBoundingClientRect(),k=cam.calPts.length;
  if(k>=CAL_PTS.length) return;
  cam.calPts.push({ix:(e.clientX-r.left)/r.width,iy:(e.clientY-r.top)/r.height,X:CAL_PTS[k][1],Y:CAL_PTS[k][2]});
  if(cam.calPts.length===CAL_PTS.length){
    const fit=fitCal(cam.calPts);
    if(fit.p){cam.cal[cam.slots[cam.calSlot]]=Object.assign({pts:cam.calPts},fit);store.set('dart.camcal',cam.cal);cam.last=`Kamera ${cam.calSlot+1} kalibriert`;}
    else cam.err='Die Kalibrierung ging nicht auf. Bitte die Punkte genauer setzen.';
    cam.calSlot=-1;cam.calPts=[];renderCam();return;
  }
  renderCam();
}
function renderCam(){
  const hdr='<header class="gbar"><div class="gmode">Kamera</div><button class="ghost" data-act="back">Zurück</button></header>';
  if(cam.calSlot>=0){
    const k=cam.calPts.length;
    app.innerHTML=`<div class="wrap">${hdr}<p>Kamera ${cam.calSlot+1}: Tippe auf <b>${CAL_PTS[k][0]}</b> <span class="muted">(Punkt ${k+1} von ${CAL_PTS.length})</span></p>
    <canvas id="calcv" class="calcv" width="640" height="480" aria-label="Standbild der Kamera zum Kalibrieren"></canvas>
    <div class="addrow"><button class="ghost" data-act="calsnap">Neues Standbild</button><button class="ghost" data-act="calundo" ${k?'':'disabled'}>Punkt zurück</button><button class="ghost" data-act="calcancel">Abbrechen</button></div></div>`;
    drawCal();return;
  }
  const short=s=>s.length>22?s.slice(0,21)+'…':s;
  const slots=cam.devices.length?[0,1,2].map(i=>{
    const ok=!!calOf(i);
    return `<div class="camslot"><div class="camhead"><b>Kamera ${i+1}</b><span class="${ok?'okc':'muted'}">${ok?'kalibriert':'nicht kalibriert'}</span></div>
    <canvas id="camprev${i}" class="camprev" width="320" height="240"></canvas>
    <div class="seg" role="group" aria-label="Gerät für Kamera ${i+1}">${cam.devices.map((d,j)=>`<button data-cs="${i}:${j}" class="${cam.slots[i]===d.id?'on':''}" aria-pressed="${cam.slots[i]===d.id}">${esc(short(d.label))}</button>`).join('')}</div>
    <button class="ghost" data-cal="${i}" ${cam.videos[i]?'':'disabled'}>Kalibrieren</button></div>`;}).join(''):'';
  app.innerHTML=`<div class="wrap">${hdr}
  <p class="muted">Drei USB-Kameras rund ums Board, etwa im 120-Grad-Abstand, knapp vor der Scheibe und flach über die Oberfläche blickend, so wie bei Autodarts. Die Erkennung läuft im Browser am PC, der Spielstand wie gewohnt. Daneben liegende Würfe korrigierst du mit „Rückgängig“ und den Tasten.</p>
  ${cam.err?`<p class="err" role="alert">${esc(cam.err)}</p>`:''}
  <button class="ghost" data-act="camscan" style="margin-bottom:14px">${cam.devices.length?'Kameras neu suchen':'Kameras suchen'}</button>
  ${slots}
  ${cam.devices.length?`<section><h2>Erkennung</h2><div class="opt"><span class="olabel">Empfindlichkeit</span><div class="seg" role="group" aria-label="Empfindlichkeit">${['Niedrig','Mittel','Hoch'].map((n,i)=>`<button data-sens="${i}" class="${cam.sens===i?'on':''}" aria-pressed="${cam.sens===i}">${n}</button>`).join('')}</div></div>
  <button class="primary start" data-act="camtoggle">${cam.active?'Erkennung stoppen':'Erkennung starten'}</button>
  <p class="camline" id="camstat">${esc(cam.last||'Noch kein Wurf erkannt')}</p></section>`:''}
  </div>`;
  camPreview();
}
async function camClick(t){
  const a=t.dataset.act;cam.err='';
  if(a==='cam'){renderCam();window.scrollTo(0,0);return;}
  if(a==='camscan'){app.querySelector('[data-act="camscan"]').textContent='Suche …';await camScan();renderCam();return;}
  if(t.dataset.cs){const [i,j]=t.dataset.cs.split(':').map(Number);cam.slots[i]=cam.devices[j].id;store.set('dart.camslots',cam.slots);await camStart();renderCam();return;}
  if(t.dataset.cal!==undefined){cam.calSlot=+t.dataset.cal;cam.calPts=[];calSnap();renderCam();return;}
  if(t.dataset.sens!==undefined){cam.sens=+t.dataset.sens;renderCam();return;}
  if(a==='camtoggle'){camToggle();renderCam();return;}
  if(a==='calsnap'){calSnap();drawCal();return;}
  if(a==='calundo'){cam.calPts.pop();renderCam();return;}
  if(a==='calcancel'){cam.calSlot=-1;cam.calPts=[];renderCam();}
}

/* ---------- Ereignisse im Setup ---------- */
app.addEventListener('click',e=>{
  if(game) return;
  if(e.target.id==='calcv'){calClick(e);return;}
  const t=e.target.closest('button');if(!t||t.disabled) return;
  if(['online','onlcreate','onljoin'].includes(t.dataset.act)||t.dataset.oseat!==undefined||t.dataset.ojseat!==undefined){onlClick(t);return;}
  if(['cam','camscan','camtoggle','calsnap','calundo','calcancel'].includes(t.dataset.act)||t.dataset.cs||t.dataset.cal!==undefined||t.dataset.sens!==undefined){camClick(t);return;}
  if(['tour','tourstart','tourend'].includes(t.dataset.act)||t.dataset.tf||t.dataset.play){tourClick(t);return;}
  if(t.dataset.act==='stats'||t.dataset.act==='back'||t.dataset.smode||t.dataset.splayer!==undefined||t.dataset.del||t.dataset.train!==undefined){statsClick(t);return;}
  if(t.dataset.mode){setup.mode=t.dataset.mode;setupErr='';saveSetup();renderSetup();return;}
  if(t.dataset.opt){const op=MODES[setup.mode].options.find(o=>o.key===t.dataset.opt);setup.opts[setup.mode][op.key]=op.choices[+t.dataset.ci][0];saveSetup();renderSetup();return;}
  if(t.dataset.voice!==undefined){setup.voice=t.dataset.voice==='1';saveSetup();renderSetup();if(setup.voice) say('Ansage an');return;}
  if(t.dataset.bl!==undefined){const pl=setup.players[+t.dataset.bl];pl.bot=+t.dataset.lv;pl.name=botName(pl.bot);saveSetup();renderSetup();return;}
  if(t.dataset.rm!==undefined){setup.players.splice(+t.dataset.rm,1);saveSetup();renderSetup();return;}
  const a=t.dataset.act;
  if(a==='add'){setup.players.push({name:'Spieler '+(setup.players.length+1)});setupErr='';saveSetup();renderSetup();
    const ins=app.querySelectorAll('.players input');const last=ins[ins.length-1];if(last){last.focus();last.select();}return;}
  if(a==='addbot'){setup.players.push({name:botName(2),bot:2});setupErr='';saveSetup();renderSetup();return;}
  if(a==='start'){startGame(false);window.scrollTo(0,0);return;}
  if(a==='resume'){startGame(true);window.scrollTo(0,0);}
});
app.addEventListener('input',e=>{
  if(game||e.target.dataset.pi===undefined) return;
  setup.players[+e.target.dataset.pi].name=e.target.value;saveSetup();
});

renderSetup();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
